[project]
name = "digital-twin-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Knowledge modules hold prose in CONTENT strings; don't wrap it for the linter.
"knowledge/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]