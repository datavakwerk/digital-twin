# Alembic config. The database URL is never stored here — it comes from
# DATABASE_URL via migrations/env.py (or is set programmatically by
# app.db.run_migrations at startup).
#
# New migration:  uv run alembic revision -m "add ..."
# Apply manually: uv run alembic upgrade head   (startup also does this)

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os