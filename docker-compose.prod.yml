# Production: one image serving the API and the built client, plus Postgres
# (pgvector) for checkpoints, the approval queue, telemetry, and vectors.
#
#   docker compose --env-file server/.env -f docker-compose.prod.yml up --build -d
#
# --env-file makes server/.env available for ${...} substitution below (the
# app container reads the same file through env_file). TLS and the domain
# terminate at the host's reverse proxy (see Commit 30).
#
# Dokploy: create a Compose service pointing at this file, paste the contents
# of server/.env into its Environment tab (Dokploy writes them to ./.env, which
# is read below), and add a Domain for service "app" on container port 3000.
# No host port is published: the Dokploy host already uses 3000 for its own UI
# and Traefik reaches the container over the compose network.
#
# Backups: run the one-shot service from a daily host cron —
#   docker compose --env-file server/.env -f docker-compose.prod.yml run --rm db-backup
# It writes ./backups/twin-<date>.sql.gz (sync the directory off-host). Restore:
#   gunzip -c backups/twin-<date>.sql.gz | \
#     docker compose -f docker-compose.prod.yml exec -T db psql -U twin twin
services:
  app:
    build: .
    expose:
      - "3000"
    # Whichever exists: ./.env (Dokploy's Environment tab) or server/.env (local).
    env_file:
      - path: .env
        required: false
      - path: server/.env
        required: false
    environment:
      DATABASE_URL: postgresql://twin:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server/.env}@db:5432/twin
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server/.env}
      POSTGRES_DB: twin
    # No host port: only app (and db-backup) reach it, on the compose network.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d twin"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: always

  # One-shot dump, run from host cron (see header). Not started by `up`.
  db-backup:
    image: pgvector/pgvector:pg17
    profiles: ["backup"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server/.env}
    entrypoint:
      ["sh", "-c", "pg_dump -h db -U twin twin | gzip > /backups/twin-$(date +%F).sql.gz"]
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data: