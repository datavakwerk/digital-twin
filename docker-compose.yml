services:
  server:
    build: ./server
    ports:
      - "3000:3000"
    env_file: server/.env
    environment:
      # Inside compose the db service is reachable by its service name; this
      # overrides whatever DATABASE_URL server/.env holds for bare-metal runs.
      DATABASE_URL: postgresql://twin:twin@db:5432/twin
    volumes:
      - ./server/app:/app/app
      - ./server/knowledge:/app/knowledge
      - ./server/migrations:/app/migrations
      - ./server/alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: twin
      POSTGRES_DB: twin
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d twin"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://server:3000
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  db-data: